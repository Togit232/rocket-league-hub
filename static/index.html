<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RL Hub">
<meta name="theme-color" content="#0a0f1c">
<title>Rocket League Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0f1c; --bg2:#0f1729; --card:#141e35; --card2:#1a2644; --line:#243356;
  --text:#e8eefc; --muted:#8fa0c4; --blue:#2f9bff; --orange:#ff8a1f; --green:#3ddc84; --red:#ff4d5e;
  --radius:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(1200px 500px at 0% -10%,rgba(47,155,255,.16),transparent 60%),
  radial-gradient(1000px 500px at 100% -10%,rgba(255,138,31,.13),transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,15,28,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;padding:14px 0 10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.3px}
.logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,var(--blue) 0 50%,var(--orange) 50% 100%)}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.btn{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:600}
.btn:hover{border-color:var(--blue)}
.btn[disabled]{opacity:.5;cursor:default}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.on{color:var(--text);border-bottom-color:var(--orange)}

main{padding:22px 0 60px}
section{display:none}
section.on{display:block}
h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2 .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--blue);cursor:pointer;background:none;border:0}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
@media(max-width:980px){.g2,.g3,.gmain{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.empty{color:var(--muted);padding:14px 4px;font-size:14px}
.sub{color:var(--muted);font-size:12.5px}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:20px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi a:hover{color:var(--blue)}

/* Spiele */
.match{display:grid;grid-template-columns:86px minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line)}
.match:first-child{border-top:0}
.match .when{font-size:12.5px;color:var(--muted);line-height:1.25}
.match .when b{display:block;color:var(--text);font-size:13.5px}
.match .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.match .t.l{text-align:right}
.match .t.lose{color:var(--muted);font-weight:500}
.match .sc{font-variant-numeric:tabular-nums;font-weight:800;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 10px;min-width:62px;text-align:center}
.match .sc.vs{font-weight:600;color:var(--muted);font-size:12.5px}
.match .tour{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-6px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .tour a:hover{color:var(--blue)}
.live{color:var(--red)!important;font-weight:800}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:1px 6px;border-radius:5px;background:rgba(255,138,31,.16);color:var(--orange);vertical-align:1px;margin-right:5px}
.tag.b{background:rgba(47,155,255,.16);color:var(--blue)}
.tag.g{background:rgba(61,220,132,.15);color:var(--green)}
.tag.r{background:rgba(255,77,94,.16);color:var(--red)}
.daysep{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:12px 6px 4px;border-top:1px solid var(--line)}
.daysep:first-child{border-top:0;padding-top:2px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.filters input{flex:1;min-width:180px;max-width:320px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;outline:none}
.filters input:focus{border-color:var(--blue)}

/* Turniere */
.tcard{display:flex;flex-direction:column;gap:8px}
.tcard h3{margin:0;font-size:16px}
.tcard h3 a:hover{color:var(--blue)}
.tcard .facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.km{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-size:13.5px;padding:6px 0;border-top:1px dashed var(--line)}
.km .n{grid-column:1/-1;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.km .a{text-align:right}
.km .a,.km .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.km .w{font-weight:800}
.km .s{font-weight:800;font-variant-numeric:tabular-nums}

/* Tabellen */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-top:0;font-weight:700;user-select:none}
th.s{cursor:pointer}
th.s:hover{color:var(--text)}
th.act{color:var(--orange)}
td.n,th.n{text-align:left}
td.rk{color:var(--muted);width:34px;text-align:left;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(255,255,255,.025)}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who img{width:24px;height:24px;object-fit:contain;flex:none}
.who .nm{font-weight:700}
.who .rn{color:var(--muted);font-size:12px;font-weight:400}
.rating{font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--bg2);min-width:70px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--orange))}
.up{color:var(--green)} .down{color:var(--red)}

/* News */
.news{display:flex;gap:12px;padding:11px 4px;border-top:1px solid var(--line)}
.news:first-child{border-top:0}
.news:hover .ti{color:var(--blue)}
.news img{width:92px;height:58px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg2)}
.news .ti{font-weight:650;line-height:1.3}
.news .su{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news .mt{color:var(--muted);font-size:12px;margin-top:4px}
.newsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media(max-width:980px){.newsgrid{grid-template-columns:minmax(0,1fr)}}

/* Patch Notes */
.patch{border-top:1px solid var(--line);padding:12px 4px}
.patch:first-child{border-top:0}
.patch summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline}
.patch summary::-webkit-details-marker{display:none}
.patch summary .ti{font-weight:700;flex:1}
.patch summary::after{content:"＋";color:var(--muted)}
.patch[open] summary::after{content:"－"}
.patch .body{white-space:pre-line;color:#cdd7ee;font-size:14px;margin:10px 0 6px;padding:12px 14px;background:var(--bg2);border-radius:10px;border:1px solid var(--line)}
.patch .lnk{color:var(--blue);font-size:13px;font-weight:600}

/* Links */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lnkc{display:block;padding:13px 15px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.lnkc:hover{border-color:var(--blue)}
.lnkc b{display:block}
.lnkc span{color:var(--muted);font-size:13px}

/* Team-Feld */
.tl{cursor:pointer}
.tl:hover{color:var(--blue);text-decoration:underline}
#teamBack{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.66);backdrop-filter:blur(3px);display:none;justify-content:flex-end}
#teamBack.on{display:flex}
#teamPanel{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--bg2);border-left:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) 22px;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.th{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.th img{width:56px;height:56px;object-fit:contain;flex:none}
.th h3{margin:0;font-size:22px;line-height:1.15}
.th .x{margin-left:auto;align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:16px;flex:none}
.th .x:hover{border-color:var(--blue)}
.tfacts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.tsec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 8px}
.person{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.person .fl{font-size:22px;width:28px;text-align:center;flex:none}
.person .pn{font-weight:700}
.person .pr{color:var(--muted);font-size:13px}
.person .ro{margin-left:auto;text-align:right;color:var(--muted);font-size:12.5px;flex:none;max-width:45%}
.tres{display:flex;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:14px}
.tres:first-of-type{border-top:0}
.tres .pl{font-weight:800;color:var(--orange);width:62px;flex:none}
.tres .pz{margin-left:auto;color:var(--muted);flex:none}
.tlinks{display:flex;flex-wrap:wrap;gap:8px}
.tnote{color:var(--muted);font-size:13px;margin-top:6px}
.tstat{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13.5px;line-height:1.5}
.tstat.warn{border-color:rgba(255,138,31,.55);background:rgba(255,138,31,.07)}
.tstat b.h{display:block;margin-bottom:2px}
.tstat .r{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tstat .r .sub{flex:1;min-width:160px}
.tstat a{color:var(--blue);font-weight:600}
.trf{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-top:1px solid var(--line);font-size:14px}
.trf:first-of-type{border-top:0}
.trf .ar{width:18px;flex:none;font-weight:800}
.trf .dt{margin-left:auto;color:var(--muted);font-size:12.5px;flex:none}

#qrBack{position:fixed;inset:0;z-index:60;background:rgba(4,7,14,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
#qrBack.on{display:flex}
#qrBox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:380px;width:100%;text-align:center;max-height:100%;overflow-y:auto}
#qrBox h3{margin:0 0 4px;font-size:19px}
#qrImg{background:#fff;border-radius:14px;padding:14px;margin:16px auto 12px;width:max-content;max-width:100%}
#qrImg svg{display:block;width:240px;height:240px;max-width:100%}
#qrBox .u{font-weight:700;word-break:break-all}
#qrBox ol{text-align:left;color:var(--muted);font-size:13.5px;padding-left:20px;margin:14px 0}

.loading{padding:80px 0;text-align:center;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding:18px 0 40px}
footer .src{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
footer .src span{padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
footer .src .bad{border-color:var(--red);color:var(--red)}
footer a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><div class="mark">🚀</div><div>Rocket League Hub<small>RLCS · Ergebnisse · News · Patch Notes</small></div></div>
      <div class="meta">
        <span class="pill" id="pPlayers" hidden><span class="dot"></span><b id="vPlayers">–</b> gerade auf Steam</span>
        <span class="pill" id="pUpdated">Lade …</span>
        <button class="btn" id="btnPhone">📱 Aufs Handy</button>
        <button class="btn" id="btnRefresh">↻ Aktualisieren</button>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main class="wrap">
  <div class="loading" id="loading"><div class="spin"></div>Daten werden geladen …</div>
  <section id="s-overview"></section>
  <section id="s-matches"></section>
  <section id="s-tournaments"></section>
  <section id="s-rankings"></section>
  <section id="s-news"></section>
  <section id="s-patch"></section>
  <section id="s-community"></section>
  <section id="s-links"></section>
</main>

<div id="teamBack"><aside id="teamPanel" role="dialog" aria-label="Team-Details"></aside></div>

<div id="qrBack"><div id="qrBox" role="dialog" aria-label="Aufs Handy holen"></div></div>

<footer><div class="wrap">
  Daten: Spiele von <a href="https://liquipedia.net/rocketleague/" target="_blank" rel="noopener">Liquipedia</a> (CC-BY-SA 3.0),
  Turniere, Rankings &amp; Statistiken von <a href="https://blast.tv/rl" target="_blank" rel="noopener">BLAST.tv</a>,
  Entwickler-News über Steam, Community über Reddit, Szene-News von SHIFT. Inoffizielles Fan-Projekt.
  <div class="src" id="srcStatus"></div>
</div></footer>

<script>
"use strict";
const TABS = [["overview","Übersicht"],["matches","Spiele"],["tournaments","Turniere"],["rankings","Rankings"],
              ["news","News"],["patch","Patch Notes"],["community","Community"],["links","Nützliches"]];
const S = {data:null, tab:(location.hash||"#overview").slice(1), mFilter:"rlcs", mView:"results", mQuery:"",
           region:"Alle", pSet:0, pSort:"rating", pDir:-1, nFilter:"Alle", cFilter:"Alle"};
const STATIC = !!window.RL_STATIC;   // true = veroeffentlichte Version mit Daten-Schnappschuss (data.json)
const $ = id => document.getElementById(id);
const nkey = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
const nf = new Intl.NumberFormat("de-DE");
const fT = new Intl.DateTimeFormat("de-DE",{hour:"2-digit",minute:"2-digit"});
const fD = new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
const fDL = new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"});
const fDY = new Intl.DateTimeFormat("de-DE",{day:"numeric",month:"short",year:"numeric"});
const d = ts => new Date(ts*1000);
const num = (v,dig=2) => v==null ? "–" : Number(v).toLocaleString("de-DE",{minimumFractionDigits:dig,maximumFractionDigits:dig});
function ago(ts){
  if(!ts) return "";
  const s = Date.now()/1000 - ts;
  if(s < 90) return "gerade eben";
  if(s < 3600) return `vor ${Math.round(s/60)} Min.`;
  if(s < 86400) return `vor ${Math.round(s/3600)} Std.`;
  if(s < 86400*14) return `vor ${Math.round(s/86400)} Tagen`;
  return fDY.format(d(ts));
}
function dayLabel(ts){
  const a = new Date(), b = d(ts), day = x => new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff = Math.round((day(b)-day(a))/86400000);
  if(diff===0) return "Heute"; if(diff===1) return "Morgen"; if(diff===-1) return "Gestern";
  return fDL.format(b);
}
function flag(cc){
  if(!cc || !/^[A-Za-z]{2}$/.test(cc)) return "";
  return String.fromCodePoint(...cc.toUpperCase().split("").map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
const IMAGES = !STATIC || !!window.RL_IMAGES;   // im Claude-Artefakt sind fremde Bilder gesperrt
const teamLogo = id => id && IMAGES ? `<img loading="lazy" alt="" src="https://assets.blast.tv/images/teams/${esc(id)}">` : "";
document.addEventListener("error", e => { if(e.target.tagName==="IMG") e.target.style.display="none"; }, true);

/* ---------- Bausteine ---------- */
function tAttr(name, id, lp){
  if(!name || /^(TBD|TBA)$/i.test(name)) return "";
  return ` data-team="${esc(name)}"${id?` data-team-id="${esc(id)}"`:""}${lp?` data-team-lp="${esc(lp)}"`:""}`;
}
const tCls = name => name && !/^(TBD|TBA)$/i.test(name) ? " tl" : "";
function matchRow(m, mode){
  const now = Date.now()/1000, isLive = !m.finished && m.ts <= now;
  const when = isLive ? `<b class="live">LIVE</b>seit ${fT.format(d(m.ts))}` : `<b>${fT.format(d(m.ts))}</b>${fD.format(d(m.ts))}`;
  const sc = m.finished || (isLive && m.scoreL!=null && m.scoreL!=="")
    ? `<span class="sc">${esc(m.scoreL||0)} : ${esc(m.scoreR||0)}</span>` : `<span class="sc vs">vs</span>`;
  const cl = t => m.finished && !t.winner ? " lose" : "";
  return `<div class="match">
    <div class="when">${when}</div>
    <div class="t l${cl(m.left)}${tCls(m.left.name)}"${tAttr(m.left.name,null,m.left.name)} title="${esc(m.left.name)}">${esc(m.left.name)}</div>${sc}
    <div class="t${cl(m.right)}${tCls(m.right.name)}"${tAttr(m.right.name,null,m.right.name)} title="${esc(m.right.name)}">${esc(m.right.name)}</div>
    <div class="tour">${m.rlcs?'<span class="tag">RLCS</span>':''}<a href="${url(m.url)}" target="_blank" rel="noopener">${esc(m.tournament)}</a></div>
  </div>`;
}
function matchList(list, withDays){
  if(!list.length) return `<div class="empty">Keine Spiele gefunden.</div>`;
  let out = "", last = "";

function teamStatus(T){
  const c = T.check || {}, reg = T.registration || {registered:[],checked:[],unknown:[]}, off = c.offseason;
  const day = ts => fDY.format(d(ts));
  let head, rule;
  if(c.complete){
    head = `✓ Kader vollständig (${c.playerCount} Spieler)`;
    rule = "Wird einmal pro Off-Season aktualisiert" + (off ? (off.active
      ? ` – das Transferfenster ist gerade offen (seit ${day(off.start)}${off.end?`, bis ${day(off.end)}`:""}).`
      : ` – letzte Off-Season: ${day(off.start)} – ${day(off.end)}.`) : ".");
  }else{
    head = c.playerCount ? `⚠ Kader unvollständig (${c.playerCount} von ${c.fullRoster} Spielern)` : "⚠ Keine Spieler eingetragen";
    rule = `Wird wöchentlich nachgeprüft – nächste Prüfung ab ${day(c.nextCheck)}.`;

  }

      + (T.staff.length ? teamSection("Organisation", T.staff, p => p.role||"", "") : "")
      + (T.results.length ? `<div class="tsec">Letzte Turniere</div>` + T.results.map(x => `<div class="tres"><span class="pl">${esc(x.place||"–")}</span><span>${esc(x.name)}</span><span class="pz">${esc(x.prize||"")}</span></div>`).join("") : "")
      + ((T.transfers||[]).length ? `<div class="tsec">Letzte Wechsel</div>` + T.transfers.slice(0,8).map(transferRow).join("") : "")
      + `<div class="tsec">Mehr zum Team</div><div class="tlinks">${Object.entries(T.links).map(([k,v]) => `<a class="btn" href="${url(v)}" target="_blank" rel="noopener">${esc(k)} ↗</a>`).join("")||'<span class="tnote">Keine Links.</span>'}</div>`
      + T.notes.map(n => `<div class="tnote">ℹ︎ ${esc(n)}</div>`).join("");
  }catch(err){
    if(my !== teamReq) return;
    panel.innerHTML = head(name, id) + `<div class="tnote">Team konnte nicht geladen werden (${esc(err.message)}).</div>`;
  }
}
document.addEventListener("keydown", e => { if(e.key==="Escape") closeTeam(); });

/* ---------- Steuerung ---------- */
function render(){
  if(!RENDER[S.tab]) S.tab = "overview";
  $("nav").innerHTML = TABS.map(t => `<button data-tab="${t[0]}" class="${t[0]===S.tab?"on":""}">${t[1]}</button>`).join("");
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id==="s-"+S.tab));
  if(!S.data) return;
  $("s-"+S.tab).innerHTML = RENDER[S.tab](S.data);
}
function go(tab){ S.tab = tab; try{ history.replaceState(null,"","#"+tab); }catch(e){ try{ location.hash = tab; }catch(e2){} } render(); window.scrollTo(0,0); }
document.addEventListener("click", e => {
  if(e.target.id==="teamBack" || e.target.closest("[data-close]")) return closeTeam();
  if(e.target.closest("[data-team-refresh]") && teamCur) return openTeam(teamCur.name, teamCur.id, teamCur.lp, true);
  const tm = e.target.closest("[data-team]");
  if(tm){ e.preventDefault(); return openTeam(tm.dataset.team, tm.dataset.teamId, tm.dataset.teamLp); }
  const t = e.target.closest("[data-tab],[data-go],[data-set],[data-sort]");
  if(!t) return;
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.go){ if(t.dataset.view) S.mView = t.dataset.view; return go(t.dataset.go); }
  if(t.dataset.set === "qrMode"){ qrMode = t.dataset.val; return showPhone(); }
  if(t.dataset.set){ const k = t.dataset.set; S[k] = k==="pSet" ? Number(t.dataset.val) : t.dataset.val; return render(); }
  if(t.dataset.sort){ if(S.pSort===t.dataset.sort) S.pDir *= -1; else { S.pSort = t.dataset.sort; S.pDir = -1; } return render(); }
});
document.addEventListener("input", e => {
  if(e.target.id!=="mQuery") return;
  S.mQuery = e.target.value; const pos = e.target.selectionStart;
  render(); const i = $("mQuery"); i.focus(); i.setSelectionRange(pos,pos);
});
async function load(force){
  const b = $("btnRefresh"); b.disabled = true; b.textContent = "↻ Lädt …";
  try{
    const r = STATIC ? await fetch("data.json", {cache:"no-store"}) : await fetch("/api/data"+(force?"?force=1":""));
    if(!r.ok) throw new Error("HTTP "+r.status);
    S.data = await r.json();
    $("loading").hidden = true;
    if(S.data.steamPlayers!=null){ $("pPlayers").hidden = false; $("vPlayers").textContent = nf.format(S.data.steamPlayers); }
    $("pUpdated").innerHTML = STATIC ? `Datenstand: <b>${fD.format(d(S.data.generated))}, ${fT.format(d(S.data.generated))} Uhr</b>`
                                     : `Stand: <b>${fT.format(new Date())} Uhr</b>`;
    $("srcStatus").innerHTML = S.data.status.map(s => `<span class="${s.ok?"":"bad"}" title="${esc(s.error||"")}">${s.ok?"✓":"✕"} ${esc(s.label)}${s.fetched?" · "+fT.format(d(s.fetched)):""}</span>`).join("");
    render();
  }catch(err){
    $("pUpdated").textContent = "Fehler beim Laden";
    if(!S.data && STATIC) $("loading").innerHTML = `Die Daten konnten nicht geladen werden (${esc(err.message)}).`;
    else if(!S.data) $("loading").innerHTML = `Der lokale Server antwortet nicht (${esc(err.message)}).<br>Bitte „Rocket League Hub starten“ erneut ausführen.`;
  }finally{ b.disabled = false; b.textContent = "↻ Aktualisieren"; }
}
/* ---------- Handy / QR-Code ---------- */
function loadQrLib(){
  if(window.qrcode) return Promise.resolve();
  return new Promise((ok, fail) => { const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    sc.onload = ok; sc.onerror = () => fail(new Error("QR-Bibliothek nicht ladbar")); document.head.appendChild(sc); });
}
const ONLINE_URL = "https://claude.ai/artifact/4ZXX9Z3ztggC7giw6cYPpd";
function qrSvg(text){ const qr = qrcode(0, "M"); qr.addData(text); qr.make(); return qr.createSvgTag({cellSize:6, margin:0, scalable:true}); }
let qrMode = "online";
async function showPhone(){
  const box = $("qrBox"), close = `<button class="btn" data-qr-close style="margin-top:6px">Schließen</button>`;
  box.innerHTML = `<h3>📱 Aufs Handy holen</h3><div class="loading" style="padding:30px 0"><div class="spin"></div></div>`;
  $("qrBack").classList.add("on");
  try{
    const info = await (await fetch("/api/info")).json();
    const local = /^(localhost|127\.|\[::1\])/.test(location.hostname);
    const target = (local ? info.urls[0] : location.origin) || null;
    if(!target){ box.innerHTML = `<h3>📱 Aufs Handy holen</h3><p class="tnote">Keine WLAN-Adresse gefunden. Ist der Mac mit dem WLAN verbunden?</p>${close}`; return; }
    await loadQrLib();
    const online = qrMode === "online";
    box.innerHTML = `<h3>📱 Aufs Handy holen</h3><div class="sub">Mit der Handy-Kamera scannen</div>
      <div class="filters" style="justify-content:center;margin:14px 0 0">${chips([["online","Online · von überall"],["wlan","Live · im WLAN"]], qrMode, "qrMode")}</div>
      <div id="qrImg">${qrSvg(online ? ONLINE_URL : target)}</div>
      <div class="u">${esc(online ? ONLINE_URL : target)}</div>
      ${!online && info.urls[1] && info.urls[1]!==target ? `<div class="sub">oder ${esc(info.urls[1])}</div>` : ""}
      ${online
        ? `<ol><li>Funktioniert überall, auch über mobile Daten.</li><li>Zeigt den Datenstand der letzten täglichen Aktualisierung.</li>
           <li>Das Handy muss bei Claude angemeldet sein – oder die Seite wurde über „Teilen“ freigegeben.</li></ol>`
        : `<ol><li>Handy und Mac müssen im selben WLAN sein.</li><li>Der Hub muss auf dem Mac laufen.</li>
           <li>Zeigt Live-Daten. Tipp: Im Handy-Browser „Zum Home-Bildschirm“ wählen.</li></ol>`}${close}`;
  }catch(err){ box.innerHTML = `<h3>📱 Aufs Handy holen</h3><p class="tnote">Fehler: ${esc(err.message)}</p>${close}`; }
}
if(STATIC) $("btnPhone").hidden = true;
$("btnPhone").addEventListener("click", showPhone);
$("qrBack").addEventListener("click", e => { if(e.target.id==="qrBack" || e.target.closest("[data-qr-close]")) $("qrBack").classList.remove("on"); });
$("btnRefresh").addEventListener("click", () => load(true));
render(); load(false);
setInterval(() => load(false), 5*60*1000);
</script>
</body>
</html>
